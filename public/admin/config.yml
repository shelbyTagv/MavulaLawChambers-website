backend:
  name: github
  repo: shelby001/MavulaLawChambers-Website
  branch: main
  base_url: https://mavulalawchambers.co.zw
  auth_endpoint: api/auth

media_folder: public/assets/images
public_path: /assets/images

collections:
  - name: news
    label: News & Notices
    folder: content/news
    create: true
    slug: "{{slug}}"
    fields:
      - { label: ID, name: id, widget: number }
      - { label: Type, name: type, widget: select, options: ["article", "notice"] }
      - { label: Title, name: title, widget: string }
      - { label: Excerpt, name: excerpt, widget: string }
      - { label: Body, name: body, widget: markdown, required: false }
      - { label: PDF URL, name: pdfUrl, widget: string, required: false }
      - { label: Image, name: image, widget: image }
      - { label: Date, name: date, widget: string, hint: "YYYY-MM-DD format" }
      - { label: Category, name: category, widget: string, required: false }
      - { label: Author, name: author, widget: string, required: false }

  - name: reviews
    label: Client Reviews
    folder: content/reviews
    create: true
    slug: "{{slug}}"
    fields:
      - { label: ID, name: id, widget: number }
      - { label: Client Name, name: clientName, widget: string }
      - { label: Excerpt, name: excerpt, widget: string }
      - { label: Full Review, name: body, widget: markdown }
      - { label: Image, name: image, widget: image }
      - { label: Rating, name: rating, widget: number, min: 1, max: 5, required: false }
      - { label: Date, name: date, widget: string, hint: "e.g., March 2026" }

  - name: team
    label: Team Members
    folder: content/team
    create: true
    slug: "{{slug}}"
    fields:
      - { label: ID, name: id, widget: number }
      - { label: Name, name: name, widget: string }
      - { label: Title, name: title, widget: string }
      - { label: Photo, name: photo, widget: image }
      - { label: Quote, name: quote, widget: string, required: false }
      - { label: Bio, name: bio, widget: markdown, required: false }
